<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101923">
<title>SupGram</title>
<style>
:root{--bg:#0e1721;--panel:#172331;--panel2:#1d2a39;--line:#263747;--text:#f4f7fb;--muted:#8c9aaa;--accent:#39a8ff;--accent2:#67d7c8;--danger:#ff5f6d;--shadow:0 18px 60px #0006}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}
.hidden{display:none!important}.app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:auto;background:var(--bg)}
.top{padding:22px 18px 12px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:28px;font-weight:850;letter-spacing:-1px}.brand span{color:var(--accent)}
.icon{width:42px;height:42px;border-radius:14px;background:transparent;display:grid;place-items:center;font-size:22px}.icon:hover{background:#ffffff0b}
.search{margin:0 18px 10px;background:#243142;border-radius:18px;padding:13px 16px;display:flex;gap:10px;align-items:center;color:var(--muted)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}
.content{flex:1;overflow:auto;padding:6px 12px 105px}.screen-title{font-size:26px;font-weight:800;padding:12px 6px 14px}
.card{background:linear-gradient(145deg,#182635,#15212e);border:1px solid #ffffff06;border-radius:22px;box-shadow:var(--shadow)}
.chat{display:flex;align-items:center;gap:13px;padding:12px 9px;border-radius:18px}.chat:hover{background:#ffffff08}.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#35b7ff,#6d6bff);font-weight:800;flex:0 0 auto;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.chat-main{min-width:0;flex:1}.chat-name{font-weight:800;font-size:16px;display:flex;justify-content:space-between;gap:8px}.chat-name small{font-weight:600;color:var(--muted);white-space:nowrap}.preview{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;font-size:14px}
.badge{background:var(--accent);color:white;min-width:22px;height:22px;border-radius:12px;display:inline-grid;place-items:center;font-size:11px;font-weight:800;padding:0 6px}
.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(94%,720px);height:74px;background:#1a2938ee;backdrop-filter:blur(20px);border:1px solid #ffffff08;border-radius:28px;display:grid;grid-template-columns:repeat(4,1fr);z-index:20;box-shadow:0 20px 60px #0008}.nav{background:transparent;color:#9aa8b7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:750}.nav b{font-size:21px}.nav.active{color:var(--accent)}.nav.active b{filter:drop-shadow(0 0 8px #39a8ff66)}
.fab{position:fixed;right:max(20px,calc(50% - 350px));bottom:101px;width:58px;height:58px;border-radius:50%;background:var(--accent);font-size:28px;box-shadow:0 12px 30px #39a8ff55;z-index:19}
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#1b405b 0,#0e1721 42%)}.auth-box{width:min(430px,100%);padding:28px;border-radius:30px;background:#152331dd;border:1px solid #ffffff0a;box-shadow:var(--shadow)}.logo{width:84px;height:84px;border-radius:28px;margin:auto;background:linear-gradient(135deg,#39a8ff,#5ee7d7);display:grid;place-items:center;font-size:40px;font-weight:900;color:#09202d}.auth h1{text-align:center;margin:18px 0 5px;font-size:32px}.auth p{text-align:center;color:var(--muted);margin:0 0 24px}.field{margin:12px 0}.field label{display:block;color:#aab6c4;font-size:12px;font-weight:750;margin:0 0 7px}.field input,.field textarea,.field select{width:100%;border:1px solid #ffffff0c;outline:0;background:#0f1a25;color:var(--text);border-radius:15px;padding:14px}.primary{width:100%;padding:14px;border-radius:15px;background:var(--accent);font-weight:850;margin-top:8px}.ghost{width:100%;padding:13px;border-radius:15px;background:#ffffff08;margin-top:10px}.error{color:#ff8c98;font-size:13px;margin-top:10px;min-height:18px}
.panel{padding:14px;border-radius:22px;background:#172432;border:1px solid #ffffff07;margin-bottom:12px}.row{display:flex;align-items:center;gap:12px;padding:13px 4px}.row .grow{flex:1}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:3px}.divider{height:1px;background:#ffffff08;margin:4px 0}.switch{width:50px;height:28px;border-radius:20px;background:#314150;padding:3px}.switch i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(22px)}
.chatview{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;max-width:760px;margin:auto}.chathead{height:76px;background:#172432dd;backdrop-filter:blur(18px);display:flex;align-items:center;padding:10px 12px;gap:10px;border-bottom:1px solid #ffffff08}.chathead .name{flex:1}.chathead .name strong{display:block}.chathead .name small{color:var(--accent2)}.messages{flex:1;overflow:auto;padding:18px 12px 20px;display:flex;flex-direction:column;gap:7px;background:radial-gradient(circle at 20% 10%,#1a2937 0,transparent 35%)}.bubble{max-width:78%;padding:10px 13px;border-radius:17px;background:#1d2b39;align-self:flex-start;box-shadow:0 4px 15px #0002}.bubble.mine{align-self:flex-end;background:#126a91}.bubble small{display:block;color:#b6d4df;text-align:right;font-size:10px;margin-top:4px}.composer{display:flex;gap:8px;padding:10px;background:#172432;border-top:1px solid #ffffff08}.composer input{flex:1;border:0;outline:0;background:#223141;border-radius:20px;padding:13px 15px;color:white}.send{width:48px;border-radius:50%;background:var(--accent);font-size:20px}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:end center;z-index:50}.sheet{width:min(760px,100%);max-height:90dvh;overflow:auto;background:#172432;border-radius:28px 28px 0 0;padding:20px;box-shadow:var(--shadow)}.sheet h2{margin:0 0 16px}.result{padding:10px;border-radius:15px;display:flex;gap:12px;align-items:center}.result:hover{background:#ffffff08}
.empty{text-align:center;color:var(--muted);padding:70px 20px}.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
@media(min-width:761px){body{background:#081018}.app,.chatview{box-shadow:0 0 80px #0008}}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="auth-box">
    <div class="logo">S</div><h1>Sup<span style="color:#39a8ff">Gram</span></h1>
    <p>Private messaging, communities and more.</p>
    <div id="loginForm">
      <div class="field"><label>EMAIL</label><input id="loginEmail" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>PASSWORD</label><input id="loginPassword" type="password" placeholder="••••••••"></div>
      <button class="primary" onclick="login()">Log in</button>
      <button class="ghost" onclick="showSignup()">Create new account</button>
    </div>
    <div id="signupForm" class="hidden">
      <div class="field"><label>USERNAME</label><input id="signupUsername" placeholder="@yourname"></div>
      <div class="field"><label>DISPLAY NAME</label><input id="signupName" placeholder="Your name"></div>
      <div class="field"><label>EMAIL</label><input id="signupEmail" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>PASSWORD</label><input id="signupPassword" type="password" placeholder="At least 6 characters"></div>
      <button class="primary" onclick="signup()">Create account</button>
      <button class="ghost" onclick="showLogin()">Back to login</button>
    </div>
    <div id="authError" class="error"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="top"><div class="brand">Sup<span>Gram</span></div><button class="icon" onclick="openSearch()">⌕</button></div>
  <div id="searchBar" class="search hidden"><span>⌕</span><input id="chatSearch" oninput="renderChats()" placeholder="Search chats"></div>
  <main id="content" class="content"></main>
  <button class="fab" onclick="newChat()">＋</button>
  <nav class="bottom">
    <button class="nav active" data-tab="chats" onclick="setTab('chats')"><b>◉</b>Chats</button>
    <button class="nav" data-tab="contacts" onclick="setTab('contacts')"><b>♙</b>Contacts</button>
    <button class="nav" data-tab="settings" onclick="setTab('settings')"><b>⚙</b>Settings</button>
    <button class="nav" data-tab="profile" onclick="setTab('profile')"><b>◉</b>Profile</button>
  </nav>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="chatView" class="chatview hidden">
  <header class="chathead"><button class="icon" onclick="closeChat()">‹</button><div id="chatAvatar" class="avatar" style="width:48px;height:48px"></div><div class="name"><strong id="chatTitle"></strong><small id="chatStatus">online</small></div><button class="icon">⋮</button></header>
  <div id="messages" class="messages"></div>
  <div class="composer"><input id="messageInput" placeholder="Write a message..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="send" onclick="sendMessage()">➤</button></div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://wmiiksggotbiugwaouzr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7Po4MI74e2WS7ivV_jJksw_ByuJshhU';
const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let user=null, profile=null, chats=[], activeChat=null, realtime=null, currentTab='chats';

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const initials=n=>(n||'S').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();

window.showSignup=()=>{$('loginForm').classList.add('hidden');$('signupForm').classList.remove('hidden');$('authError').textContent=''};
window.showLogin=()=>{$('signupForm').classList.add('hidden');$('loginForm').classList.remove('hidden');$('authError').textContent=''};

window.login=async()=>{
  $('authError').textContent=''; const email=$('loginEmail').value.trim(), password=$('loginPassword').value;
  const {error}=await sb.auth.signInWithPassword({email,password}); if(error) $('authError').textContent=error.message;
};
window.signup=async()=>{
  $('authError').textContent='';
  let username=$('signupUsername').value.trim().replace(/^@/,'').toLowerCase();
  const display_name=$('signupName').value.trim()||username;
  const email=$('signupEmail').value.trim(), password=$('signupPassword').value;
  if(!/^[a-z0-9_]{3,24}$/.test(username)){ $('authError').textContent='Username: 3–24 letters, numbers or underscore.'; return; }
  const {error}=await sb.auth.signUp({email,password,options:{data:{username,display_name}}});
  if(error) $('authError').textContent=error.message; else $('authError').textContent='Account created. Check your email if confirmation is enabled.';
};

async function boot(){
  const {data}=await sb.auth.getSession(); user=data.session?.user||null; if(user) await enterApp();
  sb.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;if(user) await enterApp();else logoutUI()});
}
async function enterApp(){
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  const {data}=await sb.from('profiles').select('*').eq('id',user.id).single(); profile=data||{};
  await loadChats(); render();
}
function logoutUI(){$('app').classList.add('hidden');$('auth').classList.remove('hidden');}
async function loadChats(){
  const {data,error}=await sb.rpc('get_my_chats');
  chats=error?[]:(data||[]);
}
function render(){ if(currentTab==='chats') renderChats(); else if(currentTab==='contacts') renderContacts(); else if(currentTab==='settings') renderSettings(); else renderProfile(); document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.tab===currentTab));}
window.setTab=t=>{currentTab=t;render();};
window.openSearch=()=>{$('searchBar').classList.toggle('hidden'); if(!$('searchBar').classList.contains('hidden')) $('chatSearch').focus();};

function renderChats(){
  const q=($('chatSearch')?.value||'').toLowerCase();
  const list=chats.filter(c=>(c.title||'').toLowerCase().includes(q)||(c.last_message||'').toLowerCase().includes(q));
  $('content').innerHTML='<div class="screen-title">Chats</div>'+ (list.length?list.map(c=>`
    <div class="chat" onclick="openChat('${c.id}','${esc(c.title)}','${esc(c.avatar_url||'')}')">
      <div class="avatar">${c.avatar_url?`<img src="${esc(c.avatar_url)}">`:esc(initials(c.title))}</div>
      <div class="chat-main"><div class="chat-name"><span>${esc(c.title||'Chat')}</span><small>${c.last_time?new Date(c.last_time).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}</small></div>
      <div class="preview">${esc(c.last_message||'Start a conversation')}</div></div>
    </div>`).join(''):'<div class="empty"><b>No chats yet</b>Tap + to find a user and start a real conversation.</div>');
}
function renderContacts(){
  $('content').innerHTML=`<div class="screen-title">Contacts</div><div class="panel">
    <div class="row" onclick="newChat()"><div class="avatar">＋</div><div class="grow"><strong>New Chat</strong><small>Search SupGram users by username</small></div></div>
  </div><div class="panel"><div class="row"><div class="avatar">☁</div><div class="grow"><strong>Sync & Privacy</strong><small>Your contacts stay under your account controls.</small></div></div></div>`;
}
function renderSettings(){
  $('content').innerHTML=`<div class="screen-title">Settings</div>
  <div class="panel">
    <div class="row"><div class="avatar">👤</div><div class="grow"><strong>Account</strong><small>${esc(profile.username?'@'+profile.username:'Set username')}</small></div><button class="icon" onclick="editProfile()">›</button></div>
    <div class="divider"></div>
    <div class="row"><div class="avatar">🔔</div><div class="grow"><strong>Notifications</strong><small>Message notifications</small></div><button id="notifySwitch" class="switch on" onclick="toggleSetting('notifications',this)"><i></i></button></div>
    <div class="row"><div class="avatar">🔒</div><div class="grow"><strong>Privacy</strong><small>Last seen and profile visibility</small></div><button class="icon">›</button></div>
    <div class="row"><div class="avatar">💾</div><div class="grow"><strong>Data & Storage</strong><small>Media and storage preferences</small></div><button class="icon">›</button></div>
  </div>
  <div class="panel"><div class="row"><div class="grow"><strong>SupGram</strong><small>Real-time chat app powered by Supabase</small></div></div>
  <button class="ghost" onclick="signOut()">Log out</button></div>`;
}
function renderProfile(){
  $('content').innerHTML=`<div style="text-align:center;padding:20px 0"><div class="avatar" style="width:100px;height:100px;margin:auto;font-size:34px">${profile.avatar_url?`<img src="${esc(profile.avatar_url)}">`:esc(initials(profile.display_name))}</div>
  <h1 style="margin:14px 0 2px">${esc(profile.display_name||'SupGram User')}</h1><div style="color:var(--muted)">@${esc(profile.username||'username')}</div></div>
  <div class="panel"><div class="row"><div class="grow"><strong>Bio</strong><small>${esc(profile.bio||'Add a short bio')}</small></div></div>
  <div class="row"><div class="grow"><strong>Email</strong><small>${esc(user.email||'')}</small></div></div></div>
  <button class="primary" onclick="editProfile()">Edit profile</button>`;
}
window.editProfile=()=>{
  $('sheet').innerHTML=`<h2>Edit profile</h2><div class="field"><label>DISPLAY NAME</label><input id="editName" value="${esc(profile.display_name||'')}"></div><div class="field"><label>USERNAME</label><input id="editUsername" value="${esc(profile.username||'')}"></div><div class="field"><label>BIO</label><textarea id="editBio" rows="4">${esc(profile.bio||'')}</textarea></div><button class="primary" onclick="saveProfile()">Save changes</button><button class="ghost" onclick="closeModal()">Cancel</button>`;
  $('modal').classList.remove('hidden');
};
window.saveProfile=async()=>{
  const username=$('editUsername').value.trim().replace(/^@/,'').toLowerCase();
  const patch={display_name:$('editName').value.trim(),username,bio:$('editBio').value.trim()};
  const {error}=await sb.from('profiles').update(patch).eq('id',user.id); if(error){alert(error.message);return}
  profile={...profile,...patch};closeModal();render();
};
window.newChat=async()=>{
  $('sheet').innerHTML=`<h2>New chat</h2><div class="search" style="margin:0 0 10px"><span>⌕</span><input id="userSearch" placeholder="Search @username" oninput="searchUsers()"></div><div id="userResults"></div>`;
  $('modal').classList.remove('hidden'); $('userSearch').focus();
};
window.searchUsers=async()=>{
  const q=$('userSearch').value.trim().replace(/^@/,''); if(q.length<2){$('userResults').innerHTML='';return}
  const {data}=await sb.from('profiles').select('id,username,display_name,avatar_url').ilike('username',`%${q}%`).neq('id',user.id).limit(15);
  $('userResults').innerHTML=(data||[]).map(p=>`<div class="result" onclick="startChat('${p.id}')"><div class="avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(initials(p.display_name))}</div><div class="grow"><strong>${esc(p.display_name||p.username)}</strong><small style="color:var(--muted)">@${esc(p.username)}</small></div></div>`).join('')||'<div class="empty" style="padding:30px">No users found.</div>';
};
window.startChat=async(otherId)=>{
  const {data,error}=await sb.rpc('get_or_create_direct_chat',{other_user_id:otherId});
  if(error){alert(error.message);return}
  closeModal();await loadChats();const c=chats.find(x=>x.id===data); if(c) openChat(c.id,c.title,c.avatar_url);
};
window.openChat=async(id,title,avatar)=>{
  activeChat=id;$('chatTitle').textContent=title||'Chat';$('chatAvatar').innerHTML=avatar?`<img src="${esc(avatar)}">`:esc(initials(title));
  $('chatView').classList.remove('hidden');await loadMessages();
  if(realtime) await sb.removeChannel(realtime);
  realtime=sb.channel('messages-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`conversation_id=eq.${id}`},payload=>appendMessage(payload.new)).subscribe();
};
async function loadMessages(){
  const {data}=await sb.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',activeChat).order('created_at',{ascending:true}).limit(300);
  $('messages').innerHTML=(data||[]).map(messageHTML).join('');scrollMessages();
}
function messageHTML(m){return `<div class="bubble ${m.sender_id===user.id?'mine':''}">${esc(m.body)}<small>${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small></div>`}
function appendMessage(m){if(!$('chatView').classList.contains('hidden')&&m.conversation_id===activeChat){$('messages').insertAdjacentHTML('beforeend',messageHTML(m));scrollMessages()} loadChats().then(renderChats)}
function scrollMessages(){requestAnimationFrame(()=>{$('messages').scrollTop=$('messages').scrollHeight})}
window.sendMessage=async()=>{
  const body=$('messageInput').value.trim();if(!body||!activeChat)return;
  $('messageInput').value='';
  const {error}=await sb.from('messages').insert({conversation_id:activeChat,sender_id:user.id,body});
  if(error){alert(error.message);$('messageInput').value=body}
};
window.closeChat=async()=>{if(realtime){await sb.removeChannel(realtime);realtime=null}activeChat=null;$('chatView').classList.add('hidden');await loadChats();renderChats()};
window.closeModal=()=>{$('modal').classList.add('hidden')};
window.toggleSetting=async(key,el)=>{el.classList.toggle('on')};
window.signOut=async()=>{await sb.auth.signOut()};

boot();
</script>
</body>
</html>
